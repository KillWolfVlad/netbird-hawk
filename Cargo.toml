[package]
name = "netbird-hawk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Predictable per-user NetBird profile rotation daemon"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.45", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.16", features = ["serde", "v4"] }
which = "8.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2.0"
chrono-tz = "0.10"
predicates = "3.1"
